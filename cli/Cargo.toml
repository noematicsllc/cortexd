[package]
name = "cortex"
version = "0.2.0"
edition = "2021"
description = "CLI for Cortex local storage daemon"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
rmpv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
native-tls = "0.2"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
hostname = "0.4"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
